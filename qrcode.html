<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
  <div class="container">
    <h1 class="text-success">Escaneie o QR Code para conectar</h1>
    <img id="qrCodeImage" src="" alt="QR Code" class="img-fluid my-3" />
    <div id="status" class="fs-4 fw-bold text-danger">Desconectado</div>
    <div id="statusMessage" class="mt-2 fs-5 text-danger">
      Conecte seu WhatsApp escaneando o código.
    </div>
  </div>

  <script>
    async function fetchQRCode() {
      try {
        const response = await fetch('http://localhost:3002/');
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const qrImage = doc.querySelector('img');
        const statusText = doc.querySelector('.status');
        const statusMessage = doc.querySelector('.status-alert');

        if (qrImage) {
          document.getElementById('qrCodeImage').src = qrImage.src;
        }
        if (statusText) {
          document.getElementById('status').innerText = statusText.innerText;
          document.getElementById('status').className = `fs-4 fw-bold ${statusText.classList.contains('text-success') ? 'text-success' : 'text-danger'}`;
        }
        if (statusMessage) {
          document.getElementById('statusMessage').innerText = statusMessage.innerText;
          document.getElementById('statusMessage').className = `mt-2 fs-5 ${statusMessage.classList.contains('text-success') ? 'text-success' : 'text-danger'}`;
        }
      } catch (error) {
        console.error('Erro ao buscar QR Code:', error);
      }
    }

    // Atualiza o QR Code a cada 30 segundos
    setInterval(fetchQRCode, 30000);
    fetchQRCode();
  </script>
</body>
</html>
