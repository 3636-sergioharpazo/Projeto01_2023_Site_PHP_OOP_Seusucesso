<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 50px;
    }
    .status {
      font-size: 1.5rem;
      font-weight: bold;
    }
    #timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #dc3545;
    }
    #details {
      font-size: 1rem;
      color: #6c757d;
      margin-top: 10px;
    }
  </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
  <div class="container">
    <h1 class="text-success" id="statusMessage">Carregando status...</h1>
    <div id="qrCodeContainer" class="my-4"></div>
    <div id="status" class="status text-danger">Desconectado</div>
    <p id="details"></p>
    <div class="mt-3">
      <p>Próximo QR Code em: <span id="timer">60</span> segundos</p>
    </div>
  </div>

  <script>
    let countdown = 60;

    function updateTimer() {
      const timerElement = document.getElementById('timer');
      if (countdown > 0) {
        countdown--;
      } else {
        countdown = 60; // Reinicia o contador quando chega a 0
        document.getElementById('statusMessage').textContent = "QR Code atualizado!";
      }

      // Muda a cor do tempo quando faltar menos de 10 segundos
      timerElement.style.color = countdown <= 10 ? "#ff0000" : "#dc3545";

      timerElement.textContent = countdown;
    }

    async function fetchStatus() {
      try {
        const response = await fetch('/status?' + new Date().getTime());
        const data = await response.json();

        const statusElement = document.getElementById('status');
        const statusMessage = document.getElementById('statusMessage');
        const qrCodeContainer = document.getElementById('qrCodeContainer');
        const detailsElement = document.getElementById('details');

        if (data.connectionStatus === 'Conectado') {
          statusElement.textContent = 'Conectado';
          statusElement.classList.remove('text-danger');
          statusElement.classList.add('text-success');
          statusMessage.textContent = 'Você está conectado ao WhatsApp!';
          qrCodeContainer.innerHTML = ''; // Remove o QR Code ao conectar
          detailsElement.textContent = `Última atualização: ${new Date().toLocaleTimeString()}`;
        } else {
          statusElement.textContent = 'Desconectado';
          statusElement.classList.remove('text-success');
          statusElement.classList.add('text-danger');
          statusMessage.textContent = 'Escaneie o QR Code para conectar';
          qrCodeContainer.innerHTML = `<img src="qrcode.png" class="img-fluid my-3" alt="QR Code" />`;
          detailsElement.textContent = `Tentativa de conexão às ${new Date().toLocaleTimeString()}`;
        }

        // Verifica se houve um desconto (exemplo: saldo mudou)
        if (data.saldoAnterior && data.saldoAtual && data.saldoAnterior > data.saldoAtual) {
          detailsElement.textContent += ` - Saldo descontado: ${data.saldoAnterior - data.saldoAtual}`;
        }

      } catch (error) {
        console.error('Erro ao buscar o status:', error);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 5000); // Atualiza status a cada 5 segundos
    setInterval(updateTimer, 1000); // Atualiza o cronômetro a cada segundo
  </script>
</body>
</html>
