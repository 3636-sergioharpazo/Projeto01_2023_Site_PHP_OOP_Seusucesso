<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 50px;
    }
    .status {
      font-size: 1.5rem;
      font-weight: bold;
    }
    #timer {
      font-size: 1.2rem;
      font-weight: bold;
      color: #dc3545;
    }
    /* Ajuste no estilo da mensagem e centralização do QR Code */
    #qrCodeContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%; /* Garantir que o container ocupe o espaço necessário */
    }
    img {
      max-width: 100%; /* Garante que a imagem se ajuste ao tamanho da tela */
      height: auto;
    }
    .status-message-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body class="d-flex flex-column align-items-center justify-content-center vh-100 text-center">
  <div class="container">
    <div class="status-message-container">
      <h1 class="text-success" id="statusMessage">Carregando status...</h1>
    </div>
    <div id="qrCodeContainer" class="my-4"></div>
    <div id="status" class="status text-danger">Desconectado</div>
    <div class="mt-3" id="timerContainer">
      <p>Próximo QR Code em: <span id="timer">60</span> segundos</p>
    </div>
  </div>

  <script>
    let countdown = 60;

    function updateTimer() {
      const timerElement = document.getElementById('timer');
      if (countdown > 0) {
        countdown--;
      } else {
        countdown = 60; // Reinicia o contador quando chega a 0
      }
      timerElement.textContent = countdown;
    }

    async function fetchStatus() {
      try {
        const response = await fetch('/status?' + new Date().getTime()); // Request the status data
        const data = await response.json();

        const statusElement = document.getElementById('status');
        const statusMessage = document.getElementById('statusMessage');
        const qrCodeContainer = document.getElementById('qrCodeContainer');
        const timerContainer = document.getElementById('timerContainer'); // Referência ao contêiner do cronômetro

        if (data.connectionStatus === 'Conectado') {
          statusElement.textContent = 'Conectado';
          statusElement.classList.remove('text-danger');
          statusElement.classList.add('text-success');
          statusMessage.textContent = 'Você está conectado ao WhatsApp!';
          qrCodeContainer.innerHTML = ''; // Remove o QR Code quando conectado
          timerContainer.style.display = 'none'; // Esconde o cronômetro quando conectado
        } else {
          statusElement.textContent = 'Desconectado';
          statusElement.classList.remove('text-success');
          statusElement.classList.add('text-danger');
          statusMessage.textContent = 'Escaneie o QR Code para conectar';
          
          // Carrega o QR Code do arquivo local qrcode.png
          const qrCodeUrl = 'qrcode.png'; // Caminho para a imagem do QR Code
          qrCodeContainer.innerHTML = `<img src="${qrCodeUrl}" class="img-fluid my-3" alt="QR Code" />`;

          timerContainer.style.display = 'block'; // Exibe o cronômetro quando desconectado
        }
      } catch (error) {
        console.error('Erro ao buscar o status:', error);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 5000); // Atualiza o status a cada 5 segundos
    setInterval(updateTimer, 1000); // Atualiza o cronômetro a cada segundo
  </script>
</body>
</html>
