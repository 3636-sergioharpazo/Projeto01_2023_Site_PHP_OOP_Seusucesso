app = "projeto01-2023-site-php-oop-seusucesso-eu1llw"


primary_region = "gru"

[build]
  dockerfile = "dockerfile"  # Certifique-se de que o caminho está correto

[[services]]
  internal_port = 3000  # Ajuste a porta se necessário
  processes = ["app"]

[[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443
