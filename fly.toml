app = "projeto01-2023-site-php-oop-seusucesso"

primary_region = "gru"

[build]
  dockerfile = "Dockerfile"  # Caso você esteja usando um Dockerfile personalizado

[[services]]
  internal_port = 3000  # Ajuste para a porta correta da sua aplicação
  processes = ["app"]

[[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443
