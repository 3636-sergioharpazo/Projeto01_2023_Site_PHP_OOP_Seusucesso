app = "projeto01-2023-site-php-oop-seusucesso"

primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[[services]]
  internal_port = 3002  # Ajuste a porta se necessário
  processes = ["app"]

[[services.ports]]
  handlers = ["http"]
  port = 80
  force_https = true

[[services.ports]]
  handlers = ["tls", "http"]
  port = 443
